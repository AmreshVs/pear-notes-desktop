name: Build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build'
        type: choice
        options: [all, macos, windows, linux]
        default: all
      mac_target:
        description: 'macOS: dmg = Developer ID, notarized. pkg = Mac App Store installer.'
        type: choice
        options: [both, dmg, pkg]
        default: both
      mac_upload:
        description: 'macOS: upload the PKG to App Store Connect (TestFlight). Unchecked = validate only.'
        type: boolean
        default: false
      windows_store:
        description: 'Windows: for Microsoft Partner Center (unsigned MSIX). Unchecked = test-signed MSIX for test PCs.'
        type: boolean
        default: false
      version:
        description: 'Marketing version, e.g. 1.2.0 (empty = keep current). A new MAJOR.MINOR restarts the build number at 1.'
        type: string
        required: false
      bump:
        description: 'Bump the build number. Both stores need a higher build for every submission.'
        type: boolean
        default: false
      core:
        description: 'Core version from npm, e.g. 1.2.0 or latest (empty = keep current). Commits "Bump core to X" before building.'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.choose.outputs.sha }}
      version: ${{ steps.choose.outputs.version }}
      build: ${{ steps.choose.outputs.build }}
      changed: ${{ steps.choose.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bump core
        if: inputs.core != ''
        env:
          CORE: ${{ inputs.core }}
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/core-bump.cjs "$CORE" --lock-only
          git push "$PUSH_URL" "HEAD:${GITHUB_REF_NAME}"

      - name: Choose the version and build number
        id: choose
        env:
          VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          read -r version build changed store msix < <(node -e "
            const { storeBuild, msixVersion } = require('./electron/storeBuild.cjs')
            const pkg = require('./package.json')
            const line = (v) => v.split('.').slice(0, 2).join('.')
            const version = process.env.VERSION || pkg.version
            let build = Number(pkg.buildNumber)
            if (line(version) !== line(pkg.version)) build = 1
            else if (process.env.BUMP === 'true') build += 1
            const changed = version !== pkg.version || build !== Number(pkg.buildNumber)
            console.log(version, build, changed, storeBuild(version, build), msixVersion(version, build))
          ")
          echo "Building ${version} build ${build} (store build ${store}, MSIX ${msix})"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  linux-x64:
    needs: version
    if: contains(fromJSON('["all","linux"]'), inputs.platforms)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell \
            /usr/share/swift /usr/local/julia* /opt/az "$AGENT_TOOLSDIRECTORY/PyPy"
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply the version
        if: needs.version.outputs.changed == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
        run: &apply-version |
          node -e "
            const fs = require('fs')
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            pkg.version = process.env.VERSION
            pkg.buildNumber = Number(process.env.BUILD)
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\\n')
          "

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg rpm

      - name: Fetch GitHub dependencies over HTTPS
        run: &github-https |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: npm run setup

      - name: Build deb, rpm and zip
        run: npm run make -- --platform=linux --arch=x64

      - name: Disk usage
        if: always()
        run: |
          df -h /
          du -sh node_modules local-ai/node_modules out/* 2>/dev/null || true

      - name: Check the packaged app
        run: |
          app="out/Pear Notes-linux-x64/resources/app"
          bare="$app/node_modules/bare-sidecar/prebuilds/linux-x64/bare"
          addon="$app/native/pear-device-auth/build/Release/pear_device_auth.node"
          [ -x "$bare" ] || { echo "::error::bare sidecar missing or not executable: $bare"; exit 1; }
          [ -f "$addon" ] || { echo "::error::pear-device-auth addon was not built: $addon"; exit 1; }
          file "$addon" | grep -q 'ELF 64-bit.*x86-64' || { echo "::error::pear-device-auth is not a linux-x64 binary"; exit 1; }
          dpkg-deb --info out/make/deb/x64/*.deb

      - name: Collect files
        run: |
          mkdir -p artifacts
          cp out/make/deb/x64/*.deb out/make/rpm/x64/*.rpm out/make/zip/linux/x64/*.zip artifacts/
          ls -l artifacts

      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: PearNotes-${{ needs.version.outputs.version }}-linux-x64
          path: artifacts/*
          retention-days: 2

  windows-x64:
    needs: version
    if: contains(fromJSON('["all","windows"]'), inputs.platforms)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      STORE_BUILD: ${{ inputs.windows_store }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply the version
        if: needs.version.outputs.changed == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
        run: *apply-version

      - name: Fetch GitHub dependencies over HTTPS
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global core.longpaths true

      - name: Install dependencies
        run: npm run setup

      - name: Build app and MSIX
        env:
          MSIX_STORE_UPLOAD: '1'
        run: npm run make -- --targets=@electron-forge/maker-msix

      - name: Collect files
        id: collect
        shell: pwsh
        run: |
          $addon = "out/Pear Notes-win32-x64/resources/app/native/pear-device-auth/build/Release/pear_device_auth.node"
          if (-not (Test-Path $addon)) {
            Write-Output "::error::The Windows Hello addon was not built: $addon"
            exit 1
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $kind = if ($env:STORE_BUILD -eq 'true') { 'store' } else { 'test-signed' }
          $msix = "artifacts/PearNotes-$version-windows-x64-$kind.msix"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item "out/make/msix/x64/Pear Notes.msix" $msix
          "version=$version" >> $env:GITHUB_OUTPUT
          "kind=$kind" >> $env:GITHUB_OUTPUT
          "msix=$msix" >> $env:GITHUB_OUTPUT

      - name: Sign with the test certificate
        if: env.STORE_BUILD != 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_TEST_CERT_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_TEST_CERT_PASSWORD }}
          MSIX: ${{ steps.collect.outputs.msix }}
        run: |
          if (-not $env:PFX_BASE64 -or -not $env:PFX_PASSWORD) {
            Write-Output "::error::Add the WINDOWS_TEST_CERT_PFX and WINDOWS_TEST_CERT_PASSWORD secrets"
            exit 1
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'test-cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName | Select-Object -Last 1
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD $env:MSIX
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:PFX_PASSWORD)
            [IO.File]::WriteAllBytes("artifacts/PearNotes-test-cert.cer", $cert.Export('Cert'))
            $signer = (Get-AuthenticodeSignature $env:MSIX).SignerCertificate.Subject
            if ($signer -ne 'CN=B816EEFE-E307-4467-A119-53E4B4207BCA') {
              Write-Output "::error::Signed by '$signer', which does not match the MSIX publisher"
              exit 1
            }
          } finally {
            Remove-Item $pfx -Force
          }

      - name: List files
        shell: pwsh
        run: Get-ChildItem artifacts | Format-Table Name, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB) } }

      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: PearNotes-${{ steps.collect.outputs.version }}-windows-x64-${{ steps.collect.outputs.kind }}
          path: |
            artifacts/*.msix
            artifacts/*.cer
          retention-days: 2

  macos-arm64:
    needs: version
    if: contains(fromJSON('["all","macos"]'), inputs.platforms)
    runs-on: macos-26
    timeout-minutes: 90
    env:
      BUILD_DMG: ${{ inputs.mac_target != 'pkg' }}
      BUILD_PKG: ${{ inputs.mac_target != 'dmg' }}
      APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
      MAC_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
      MAS_CODESIGN_IDENTITY: ${{ secrets.MAS_CODESIGN_IDENTITY }}
      MAS_INSTALLER_IDENTITY: ${{ secrets.MAS_INSTALLER_IDENTITY }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply the version
        if: needs.version.outputs.changed == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
        run: *apply-version

      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 on this runner image"
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Check the signing secrets
        env:
          CERTS_P12: ${{ secrets.MAC_CERTS_P12 }}
          CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          missing=()
          for name in APPLE_BUNDLE_ID ASC_KEY_ID ASC_ISSUER_ID CERTS_P12 CERTS_PASSWORD ASC_KEY_P8; do
            [ -z "${!name}" ] && missing+=("$name")
          done
          if [ "$BUILD_DMG" = true ] && [ -z "$MAC_CODESIGN_IDENTITY" ]; then missing+=(MAC_CODESIGN_IDENTITY); fi
          if [ "$BUILD_PKG" = true ]; then
            for name in MAS_CODESIGN_IDENTITY MAS_INSTALLER_IDENTITY PROFILE; do
              [ -z "${!name}" ] && missing+=("$name")
            done
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]} (CERTS_* = MAC_CERTS_*, PROFILE = MAS_PROVISIONING_PROFILE_BASE64)"
            exit 1
          fi

      - name: Install the signing material
        env:
          CERTS_P12: ${{ secrets.MAC_CERTS_P12 }}
          CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          echo "$CERTS_P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -k "$keychain" -P "$CERTS_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certs.p12"

          for ca in AppleWWDRCAG3 DeveloperIDG2CA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" || true
          done

          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identities=$(security find-identity -v)
          echo "$identities"
          fail=0
          need() {
            case "$2" in
              "$3"*) ;;
              *) echo "::error::The $1 secret must start with \"$3\""; fail=1; return ;;
            esac
            grep -qF "\"$2\"" <<< "$identities" || {
              echo "::error::MAC_CERTS_P12 has no identity named exactly like the $1 secret"
              fail=1
            }
          }
          if [ "$BUILD_DMG" = true ]; then need MAC_CODESIGN_IDENTITY "$MAC_CODESIGN_IDENTITY" "Developer ID Application: "; fi
          if [ "$BUILD_PKG" = true ]; then
            need MAS_CODESIGN_IDENTITY "$MAS_CODESIGN_IDENTITY" "3rd Party Mac Developer Application: "
            need MAS_INSTALLER_IDENTITY "$MAS_INSTALLER_IDENTITY" "3rd Party Mac Developer Installer: "
          fi
          [ "$fail" = 0 ] || exit 1

          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

          if [ -n "$PROFILE" ]; then
            echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/pear-notes.provisionprofile"
            echo "MAS_PROVISIONING_PROFILE=$RUNNER_TEMP/pear-notes.provisionprofile" >> "$GITHUB_ENV"
          fi

      - name: Fetch GitHub dependencies over HTTPS
        run: *github-https

      - name: Install dependencies
        run: npm run setup

      - name: Build, validate and upload the Mac App Store PKG
        if: env.BUILD_PKG == 'true'
        env:
          UPLOAD: ${{ inputs.mac_upload }}
        run: |
          if [ "$UPLOAD" = true ]; then
            npm run release:mac -- --no-commit --upload
          else
            npm run release:mac -- --no-commit
          fi
          mkdir -p artifacts
          cp out/make/*.pkg artifacts/

      - name: Build and notarize the Developer ID DMG
        if: env.BUILD_DMG == 'true'
        run: |
          npm run release:mac:dmg
          mkdir -p artifacts
          cp out/make/*.dmg artifacts/

      - name: List files
        run: ls -lh artifacts

      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: PearNotes-${{ needs.version.outputs.version }}-macos-arm64
          path: artifacts/*
          retention-days: 2

      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf ~/.appstoreconnect "$RUNNER_TEMP/pear-notes.provisionprofile"

  record-version:
    needs: [version, linux-x64, windows-x64, macos-arm64]
    if: >-
      always() && needs.version.outputs.changed == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Record the bumped version
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch "$PUSH_URL" "$GITHUB_REF_NAME"
          git checkout -B record-version FETCH_HEAD
          current=$(node -p "const { storeBuild } = require('./electron/storeBuild.cjs'); const pkg = require('./package.json'); storeBuild(pkg.version, pkg.buildNumber)")
          target=$(node -p "require('./electron/storeBuild.cjs').storeBuild(process.env.VERSION, process.env.BUILD)")
          if [ "$current" -ge "$target" ]; then
            echo "The branch is already at store build ${current}, not moving it back to ${target}"
            exit 0
          fi
          node -e "
            const fs = require('fs')
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            pkg.version = process.env.VERSION
            pkg.buildNumber = Number(process.env.BUILD)
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\\n')
          "
          git commit -am "Bump build to ${VERSION} (${BUILD})"
          git push "$PUSH_URL" "HEAD:${GITHUB_REF_NAME}"
