name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Give git read access to pear-notes-core
        shell: bash
        env:
          CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
        run: |
          if [ -z "$CORE_REPO_TOKEN" ]; then
            echo "::error::Add a CORE_REPO_TOKEN secret (fine-grained token, pear-notes-core, Contents: read-only)"
            exit 1
          fi
          base="https://x-access-token:${CORE_REPO_TOKEN}@github.com/"
          git config --global url."$base".insteadOf "https://github.com/"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"
          git config --global core.longpaths true

      - name: Install dependencies
        run: npm run setup

      - name: Build app and Store MSIX
        env:
          MSIX_STORE_UPLOAD: '1'
        run: npm run make -- --targets=@electron-forge/maker-msix

      - name: Collect files
        id: collect
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force release | Out-Null
          7z a -tzip "release/PearNotes-$version-windows-x64.zip" "./out/Pear Notes-win32-x64/*" | Out-Null
          Copy-Item "out/make/msix/x64/Pear Notes.msix" "release/PearNotes-$version-windows-x64-store.msix"
          Get-ChildItem release | Format-Table Name, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB) } }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload the app zip for testing
        uses: actions/upload-artifact@v4
        with:
          name: PearNotes-${{ steps.collect.outputs.version }}-windows-x64
          path: release/*.zip
          retention-days: 3

      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --notes ""
          gh release upload "$TAG" release/* --clobber
